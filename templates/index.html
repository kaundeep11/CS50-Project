{% extends "layout.html" %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow mb-4">
            <div class="card-body">
                <h4 class="mb-3">Add New Task</h4>
                <form action="/" method="post" class="d-flex gap-2">
                    <input type="text" name="task" class="form-control" placeholder="Enter your task..." required>
                    <button type="submit" class="btn btn-primary">Add</button>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <h4 class="mb-3">My Tasks ({{ todos|length }})</h4>
                {% if todos|length == 0 %}
                    <p class="text-muted">No tasks yet! Add one above.</p>
                {% endif %}
                <ul class="list-group">
                    {% for todo in todos %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span class="{% if todo.done %}text-decoration-line-through text-muted{% endif %}">
                            {{ todo.task }}
                        </span>
                        <div class="d-flex gap-2">
                            {% if not todo.done %}
                            <a href="/complete/{{ todo.id }}" class="btn btn-sm btn-success">✓ Done</a>
                            {% endif %}
                            <a href="/delete/{{ todo.id }}" class="btn btn-sm btn-danger">🗑 Delete</a>
                        </div>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
